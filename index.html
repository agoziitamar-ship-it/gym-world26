<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>GYM WORLD</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1724;color:#fff;font-family:system-ui}button,input{font:inherit}button{background:#49d69a;border:0;border-radius:12px;padding:12px;font-weight:700;color:#08251c;cursor:pointer}.secondary{background:#35465b;color:white}.screen{height:100dvh;overflow:hidden;position:relative}.hidden{display:none!important}#menu{display:grid;place-items:center;background:radial-gradient(circle,#276659,#0d1724)}.panel{width:min(94vw,420px);padding:22px;background:#17283deF;border:1px solid #466078;border-radius:18px;max-height:92dvh;overflow:auto}.panel h1{text-align:center;color:#65e7b5;letter-spacing:3px}.stack{display:grid;gap:12px}.stack button{width:100%}.muted{color:#b5c3d1;font-size:13px}.field{width:100%;background:#0d1724;color:white;padding:10px;border:1px solid #668097;border-radius:9px}#world{background:linear-gradient(#9cd4e5 0 45%,#6d8b77 45%)}#world.night{background:linear-gradient(#17294d 0 45%,#354e52 45%)}#street{position:absolute;top:61%;height:22%;width:100%;background:#626f77;border-top:6px solid #b7b8ac;border-bottom:6px solid #b7b8ac}#street:after{content:'';position:absolute;top:47%;width:100%;border-top:3px dashed #f4e6a8}.buildings{position:absolute;top:22%;width:100%;display:flex;justify-content:space-around;gap:5px;padding:0 7px}.building{width:19%;height:35vh;background:linear-gradient(90deg,#53738a,#8fb0bf);border:3px solid #344e5e;border-radius:8px 8px 0 0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:13px;cursor:pointer;box-shadow:6px 6px #0003}.building:nth-child(even){background:linear-gradient(90deg,#777f98,#a1a7b9)}.building span{background:#16293edc;border-radius:6px;padding:5px;text-align:center;font-size:clamp(9px,2.1vw,15px);font-weight:800}#avatar{position:absolute;left:49%;top:75%;font-size:54px;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 2px #0006);transition:left .12s,top .12s}#hud{position:absolute;inset:0;pointer-events:none}#clock{position:absolute;right:12px;top:12px;background:#0c1b2bdb;padding:10px;border-radius:10px;font-size:13px}#phone{position:absolute;bottom:18px;right:15px;border-radius:50%;font-size:24px;pointer-events:auto}#move{position:absolute;bottom:20px;left:18px;display:grid;grid-template-columns:repeat(3,40px);gap:3px;pointer-events:auto}#move button{padding:8px;background:#ffffffa8}#toast{position:absolute;top:75px;left:50%;transform:translateX(-50%);background:#14263fe8;border-radius:12px;padding:12px;text-align:center;max-width:85vw;min-width:210px}#modal{position:absolute;inset:0;background:#050b14d9;display:grid;place-items:center;padding:10px;z-index:5}#modal h2{color:#6de6b7;margin-top:0}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.item{padding:10px 0;border-bottom:1px solid #3e5265}.item button{padding:7px}.pill{background:#283d51;padding:6px 9px;border-radius:10px}#interior{position:absolute;inset:0;background:linear-gradient(140deg,#526a74,#263e4d);display:grid;place-items:center}#interior .room{background:#a5a69b;border:10px solid #526d75;width:85vw;height:65vh;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;padding:12px}#exit{position:absolute;top:15px;left:15px}</style><meta name="theme-color" content="#0d1724"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="GYM WORLD"><meta name="description" content="GYM WORLD mobile game prototype"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"></head><body><div id="menu" class="screen"><div class="panel"><h1>🏋️ GYM WORLD</h1><p style="text-align:center" class="muted">BUILD YOUR BODY. BUILD YOUR LIFE.</p><div class="stack"><button onclick="newGame()">New World</button><button class="secondary" onclick="continueGame()">Continue World</button><button class="secondary" onclick="openModal('Settings','English is the default language. More settings coming soon.')">Settings</button></div><p class="muted" style="text-align:center">Early playable demo · local save only</p></div></div><div id="world" class="screen hidden"><div id="street"></div><div class="buildings"><div class="building" onclick="enter('Home')"><span>🏠 HOME</span></div><div class="building" onclick="enter('Gym')"><span>🏋️ GYM</span></div><div class="building" onclick="shop('Market')"><span>🛒 MARKET</span></div><div class="building" onclick="shop('Shop')"><span>👕 SHOP</span></div><div class="building" onclick="shop('Furniture')"><span>🛋️ HOME STORE</span></div></div><div id="avatar">🧍</div><div id="interior" class="hidden"><button id="exit" class="secondary" onclick="exitRoom()">← City</button><div class="room" id="room"></div></div><div id="hud"><div id="clock"></div><div id="toast" class="hidden"></div><div id="move"><span></span><button onclick="move(0,-1)">↑</button><span></span><button onclick="move(-1,0)">←</button><button onclick="move(0,1)">↓</button><button onclick="move(1,0)">→</button></div><button id="phone" onclick="phoneUI()">📱</button></div></div><div id="modal" class="hidden"><div class="panel"><div class="row"><h2 id="title"></h2><button class="secondary" onclick="closeModal()">✕</button></div><div id="content"></div></div></div><script>const $=x=>document.getElementById(x),KEY='gym_world_demo_save';let g=null;const dayNames=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];function save(){if(g)localStorage.setItem(KEY,JSON.stringify(g))}function openModal(t,html){$('title').textContent=t;$('content').innerHTML=html;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3500)}function newGame(){openModal('Create Character',`<div class="stack"><label>Name<input id="name" class="field" value="Alex" maxlength="18"></label><button onclick="create()">Create World</button></div>`)}function create(){g={name:$('name').value.trim()||'Alex',money:500,day:1,hour:8,steps:0,muscle:0,strength:30,posing:0,food:0,photos:0,x:49,y:75,work:0};save();closeModal();launch();enter('Home');toast('Welcome to GYM WORLD!')}function continueGame(){try{g=JSON.parse(localStorage.getItem(KEY));if(!g)throw 0;launch();enter('Home')}catch(e){openModal('No saved world','Create a new world to start playing.')}}function launch(){$('menu').classList.add('hidden');$('world').classList.remove('hidden');refresh()}function refresh(){$('clock').textContent=`${dayNames[(g.day-1)%7]} · Day ${g.day} · ${String(g.hour).padStart(2,'0')}:00`;$('avatar').style.left=g.x+'%';$('avatar').style.top=g.y+'%';$('world').classList.toggle('night',g.hour<6||g.hour>=19);save()}function advance(hours){let h=g.hour+hours;g.day+=Math.floor(h/24);g.hour=h%24;if(Math.floor(h/24)>0)g.steps=0;refresh()}function move(dx,dy){if(!$('interior').classList.contains('hidden'))return;g.x=Math.max(5,Math.min(95,g.x+dx*3));g.y=Math.max(63,Math.min(92,g.y+dy*3));g.steps+=12;refresh()}function enter(place){$('interior').classList.remove('hidden');$('room').innerHTML=place==='Home'?`<button onclick="sleep()">🛏️ Sleep</button><button onclick="eat()">🧊 Fridge / Eat</button><button onclick="openModal('Wardrobe','👕 GYM WORLD starter outfit equipped.')">👕 Wardrobe</button><button onclick="openModal('Edit Home','Furniture placement is planned for a future version.')">🛋️ Edit Home</button>`:`<button onclick="train()">🏋️ Exercises</button><button onclick="pose()">💪 Posing Room</button><button onclick="trainer()">💼 Trainer Shift</button><button onclick="toast('Jake: Bro, looking strong!')">🤝 Jake</button>`;advance(0)}function exitRoom(){$('interior').classList.add('hidden')}function sleep(){advance(8);let d=(g.day-1)%7;toast(d===6?"It's Saturday! Enjoy your day off! 🌴":[0,2,4,5].includes(d)?'Good morning! Today is Workout Day! 💪':'Good morning! Today is Work Day! 💼')}const exercises=['Bench Press','Lat Pulldown','Squat','Shoulder Press','Preacher Curl','Triceps Pushdown','Dumbbell Curl','Pull-ups'];
function train(){openModal('GYM — Training',`<p class="muted">Choose an exercise, weight and target reps. Your actual limit is hidden.</p><label>Exercise<select class="field" id="exercise">${exercises.map(e=>`<option>${e}</option>`).join('')}</select></label><label>Weight (kg)<input class="field" id="weight" type="number" min="1" max="250" value="30"></label><label>Target reps<input class="field" id="targetReps" type="number" min="1" max="30" value="10"></label><button style="margin-top:10px" onclick="lift()">Start Set</button>`)}
function lift(){let w=Number($('weight').value),target=Math.round(Number($('targetReps').value)),ex=$('exercise').value;if(!Number.isFinite(w)||w<=0||!Number.isFinite(target)||target<1||target>30){toast('Choose a valid weight and rep count');return}let difficulty={'Bench Press':1,'Lat Pulldown':.9,'Squat':1.4,'Shoulder Press':.65,'Preacher Curl':.4,'Triceps Pushdown':.5,'Dumbbell Curl':.35,'Pull-ups':.8}[ex]||1;let cap=g.strength*difficulty;let reps=w>cap*1.22?0:Math.max(1,Math.floor(14*(cap*1.18-w)/(cap*.8)));reps=Math.min(target,Math.max(0,reps));let success=reps>0;if(success){g.strength+=Math.min(.6,reps*.055);g.muscle+=Math.min(.65,reps*.06)}advance(1);openModal('🏋️ '+ex,`<h2>${reps}/${target} reps</h2><p>${reps<target?'💥 Muscle failure! Your character struggles on the next rep and the weight is secured safely.':'💪 Set complete!'}</p><p class="muted">${success?'Training progress saved.':'Too heavy — try a lighter weight.'}</p><button onclick="train()">Next Set</button> <button class="secondary" onclick="closeModal();toast('Workout finished! You can take a photo in the posing room. 📸')">Finish Workout</button>`)}
function pose(){g.posing++;advance(1);openModal('Posing Room',`<p>💪 Front Double Biceps</p><p>Posing practice: ${g.posing}</p><button onclick="photo()">Take Progress Photo</button>`)}function photo(){g.photos++;save();openModal('Progress Photo',`📸 Photo #${g.photos} saved on Day ${g.day}.<p class="muted">Muscle growth: ${g.muscle.toFixed(1)}</p>`)}function trainer(){if(g.muscle<10){toast('Unlock trainer career at Muscular level (10 muscle points).');return}g.money+=180;g.work++;advance(8);toast('Trainer shift complete! +$180')}function eat(){if(g.food<1){openModal('Fridge','Your fridge is empty. Buy food at GYM MARKET.');return}openModal('Fridge',`Food portions: ${g.food}<p><button onclick="g.food--;advance(1);closeModal();toast('Meal eaten! 🍽️')">Eat a meal</button></p>`)}function shop(type){let arr=type==='Market'?[['Chicken & rice meal',15],['Protein yogurt',8],['Banana',3]]:type==='Shop'?[['GYM WORLD Blender',90],['Home Treadmill',450],['Komodo Kings Shirt',35]]:[['Sofa',120],['Trophy Shelf',85],['Plant',15]];openModal(type==='Market'?'GYM MARKET':type==='Shop'?'GYM SHOP':'GYM HOME',`<p class="muted">Balance: $${g.money}</p>${arr.map(([name,price])=>`<div class="item row"><span>${name} — $${price}</span><button onclick="buy('${type}',${price},'${name}')">Buy</button></div>`).join('')}`)}function buy(type,price,name){if(g.money<price){toast('Not enough money');return}g.money-=price;if(type==='Market')g.food++;save();shop(type);toast(name+' purchased!')}function phoneUI(){openModal('📱 GYM PHONE',`<div class="stack"><button onclick="openModal('Wallet','Balance: $'+g.money+'<p>Trainer shifts: '+g.work+'</p>')">💰 Wallet</button><button onclick="openModal('Steps','Today: '+g.steps+' steps<br>Estimated calories: '+Math.round(g.steps*.03)+' kcal')">👟 Steps</button><button onclick="openModal('Progress','Progress photos: '+g.photos+'<br>Muscle growth: '+g.muscle.toFixed(1)+'<br>Posing practice: '+g.posing)">📸 Progress</button><button onclick="openModal('Schedule','Sunday: Workout<br>Monday: Work<br>Tuesday: Workout<br>Wednesday: Work<br>Thursday: Workout<br>Friday: Workout<br>Saturday: Free')">📅 Schedule</button><button onclick="openModal('Messages','Jake: Bro, chest day today? 💪')">💬 Messages</button><button onclick="openModal('Competitions','Online competitions are planned for a later version.')">🏆 Competitions</button></div>`)}let dragStart=null;const movePad=$('move');movePad.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;dragStart={x:e.clientX,y:e.clientY};movePad.setPointerCapture(e.pointerId)});movePad.addEventListener('pointermove',e=>{if(!dragStart||!g)return;let dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;if(Math.abs(dx)+Math.abs(dy)>14){move(Math.sign(dx),Math.sign(dy));dragStart={x:e.clientX,y:e.clientY}}});movePad.addEventListener('pointerup',()=>dragStart=null);
document.addEventListener('keydown',e=>{if(!g)return;let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d)move(...d)});</script><script>if("serviceWorker" in navigator && location.protocol==="https:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body></html>
