<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101a2b"><link rel="manifest" href="manifest.webmanifest">
<title>GYM WORLD 26</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a2b;color:white;font-family:system-ui,Arial;touch-action:none}
canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated}
#hud{position:fixed;inset:0;pointer-events:none}button{pointer-events:auto;cursor:pointer;border:1px solid #ffffff55;background:#152338dd;color:white;border-radius:12px;font-weight:800;font-size:15px;padding:10px 15px}
#top{position:absolute;top:env(safe-area-inset-top,8px);left:12px;right:12px;display:flex;justify-content:space-between;gap:10px}
#tip{position:absolute;left:50%;top:17%;transform:translateX(-50%);background:#132638e8;border:1px solid #ffffff44;padding:8px 13px;border-radius:12px;text-align:center;font-size:13px;max-width:85vw}
#pad{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:18px;display:grid;grid-template-columns:repeat(3,52px);gap:4px}
#pad button{width:52px;height:52px;padding:0;font-size:24px;background:#253c55d9;touch-action:none}
#actions{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));right:18px;display:flex;gap:8px;align-items:end}
#enter{background:#32c98c;color:#09261b;border:0;min-height:54px}#phone{font-size:25px;min-height:54px}
#overlay{position:fixed;inset:0;background:#091421e8;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5;overflow:auto;touch-action:pan-y}
#overlay.hidden{display:none}.panel{width:min(94vw,470px);max-height:90dvh;overflow:auto;background:#1c2d40;border:1px solid #6a8290;border-radius:18px;padding:20px;box-shadow:0 12px 60px #0008}
.panel h1{color:#57e4ae;letter-spacing:2px;margin:0 0 12px}.panel h2{margin:0 0 12px}.panel p{color:#cbd7e1;line-height:1.45}
.panel button{width:100%;margin:5px 0;background:#39c58b;color:#09241c;border:0}.panel button.alt{background:#344c65;color:white}
input,select{background:#102033;color:white;border:1px solid #667e8e;padding:10px;border-radius:8px;width:100%;margin:5px 0 10px}
.small{font-size:12px;color:#a9bbc8}#orientation{position:absolute;top:64px;right:12px;color:#fff9;font-size:11px}
</style></head><body>
<canvas id="game"></canvas>
<div id="hud"><div id="top"><button id="back">☰ Menu</button><button id="clock">Sunday · Day 1 · 08:00</button></div>
<div id="tip">Move with arrows or WASD · approach a building</div><div id="pad">
<span></span><button data-move="up">▲</button><span></span>
<button data-move="left">◀</button><button data-move="down">▼</button><button data-move="right">▶</button></div>
<div id="actions"><button id="enter" style="display:none">ENTER</button><button id="phone">📱</button></div><div id="orientation">Landscape recommended ↻</div></div>
<div id="overlay"><div class="panel" id="panel"></div></div>
<script>
(()=>{
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),panel=document.querySelector('#panel');
const W=24,H=24,TW=76,TH=38, SAVE='gymworld26_v2';
let game=null,keys=new Set(),near=null,last=0;
const buildings=[
{x:4,y:4,w:3,h:3,name:'HOME',type:'home',color:'#e4b58d'},
{x:14,y:4,w:4,h:3,name:'GYM WORLD',type:'gym',color:'#54a9bc'},
{x:4,y:14,w:4,h:3,name:'GYM MARKET',type:'market',color:'#c9a0c8'},
{x:14,y:14,w:4,h:3,name:'GYM SHOP',type:'shop',color:'#d6c06b'},
{x:9,y:2,w:3,h:3,name:'GYM BAR',type:'bar',color:'#d98e82'},
{x:9,y:19,w:4,h:3,name:'GYM PARK',type:'park',color:'#86c48b'}];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function save(){if(game)localStorage.setItem(SAVE,JSON.stringify(game))}
function load(){try{const g=JSON.parse(localStorage.getItem(SAVE));if(g&&typeof g.x==='number')return g}catch(e){}return null}
function fresh(){return {x:10,y:10,scene:'city',day:1,minute:480,cash:500,gender:'male',name:'Player',workouts:0,food:3,steps:0,strength:10,muscle:0,shirt:'#38d59d'}}
function time(n=0){game.minute+=n;while(game.minute>=1440){game.minute-=1440;game.day++}save()}
function timeLabel(){const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];return `${days[(game.day-1)%7]} · Day ${game.day} · ${String(Math.floor(game.minute/60)).padStart(2,'0')}:${String(game.minute%60).padStart(2,'0')}`}
function show(title,body,buttons){overlay.classList.remove('hidden');panel.innerHTML='<h2>'+title+'</h2><p>'+body+'</p>';buttons.forEach(([label,fn,alt])=>{let b=document.createElement('button');b.textContent=label;if(alt)b.className='alt';b.onclick=fn;panel.appendChild(b)})}
function close(){overlay.classList.add('hidden');updateHUD()}
function menu(){keys.clear();show('🏋️ GYM WORLD 26','Pixel city prototype · Your world is saved on this device.',[
['▶ Continue World',()=>{game=load()||fresh();close()}],
['＋ New World',()=>{if(game&&!confirm('Start a new world? This replaces the local save.'))return;game=fresh();save();close()}],
['ℹ About',()=>show('About this build','This is the first explorable city prototype. Workouts, interiors, shopping and online play are not complete yet.',[['Back',menu]])]
])}
function updateHUD(){if(!game)return;document.querySelector('#clock').textContent=timeLabel();let b=buildings.find(b=>Math.abs(game.x-(b.x+b.w/2))<3&&Math.abs(game.y-(b.y+b.h/2))<3);near=game.scene==='city'?b:null;let e=document.querySelector('#enter');e.style.display=near?'block':'none';e.textContent=near?'ENTER '+near.name:'ENTER';document.querySelector('#tip').textContent=game.scene==='city'?(near?'Tap ENTER to visit '+near.name:'Explore the city · move with arrows / WASD'):'Inside '+game.scene.toUpperCase()+' · use the action button';if(game.scene!=='city'){e.style.display='block';e.textContent='ACTIONS'}}
function act(){if(!game)return;if(game.scene==='city'&&near){game.scene=near.type;time(5);save();interiorMenu()}else if(game.scene!=='city')interiorMenu()}

function stats(){game.strength??=10;game.muscle??=0;game.workouts??=0}
const exercises=[
{name:'Bench Press',muscle:'Chest',base:25},
{name:'Lat Pulldown',muscle:'Back',base:30},
{name:'Squat',muscle:'Legs',base:35},
{name:'Shoulder Press',muscle:'Shoulders',base:15},
{name:'Preacher Curl',muscle:'Biceps',base:10},
{name:'Triceps Pushdown',muscle:'Triceps',base:15}
];
function gymMenu(){
stats();
show('🏋️ GYM WORLD · TRAINING',`Choose your workout style.<br><b>Strength:</b> ${game.strength.toFixed(1)} · <b>Muscle:</b> ${game.muscle.toFixed(1)} · <b>Sessions:</b> ${game.workouts}`,[
['⚡ Quick Workout',quickMenu],
['🏋️ Normal Workout',normalMenu],
['← Return to city',()=>{game.scene='city';save();close()},true]
])}
function quickMenu(){
show('⚡ Quick Workout','Pick a workout. Your character trains automatically and in-game time advances.',[
['Upper Body · 45 min',()=>quickFinish('Upper Body',45,0.8,0.6)],
['Lower Body · 45 min',()=>quickFinish('Lower Body',45,0.8,0.6)],
['Full Body · 60 min',()=>quickFinish('Full Body',60,1,0.8)],
['← Back',gymMenu,true]
])}
function quickFinish(name,minutes,muscle,strength){
stats();game.workouts++;game.muscle+=muscle;game.strength+=strength;time(minutes);save();
show('✅ Workout complete!',`${name} finished in ${minutes} minutes.<br>Muscle +${muscle.toFixed(1)} · Strength +${strength.toFixed(1)}<br>Total workouts: ${game.workouts}`,[
['Another workout',gymMenu],['← Return to city',()=>{game.scene='city';save();close()},true]
])}
function normalMenu(){
stats();
show('🏋️ Normal Workout','Choose a machine. Set the weight and reps; the character performs the set automatically.',[
...exercises.map((ex,i)=>[ex.name+' · '+ex.muscle,()=>exerciseMenu(i)]),
['← Back',gymMenu,true]
])}
function exerciseMenu(i){
const ex=exercises[i];
overlay.classList.remove('hidden');
panel.innerHTML=`<h2>🏋️ ${ex.name}</h2><p>Muscle: ${ex.muscle}<br>Strength: ${game.strength.toFixed(1)}<br>Choose your weight and repetitions.</p><label>Weight (kg)<input id="liftWeight" type="number" min="1" max="400" step="2.5" value="${ex.base}"></label><label>Repetitions<input id="liftReps" type="number" min="1" max="30" step="1" value="10"></label>`;
let b=document.createElement('button');b.textContent='▶ Start set';b.onclick=()=>{
const weight=Number(document.querySelector('#liftWeight').value),reps=Number(document.querySelector('#liftReps').value);
if(!Number.isFinite(weight)||weight<1||weight>400||!Number.isInteger(reps)||reps<1||reps>30){alert('Enter a weight from 1–400 kg and 1–30 repetitions.');return}
performSet(ex,weight,reps)
};panel.appendChild(b);
let back=document.createElement('button');back.textContent='← Machines';back.className='alt';back.onclick=normalMenu;panel.appendChild(back);
}
function performSet(ex,weight,reps){
stats();
const capacity=ex.base+game.strength*1.6;
const effort=weight/capacity;
const completed=effort<=0.8?reps:Math.max(0,Math.min(reps,Math.floor(reps*(1.4-effort))));
const success=completed===reps;
const gain=completed>0?Math.min(0.35,0.08+completed*0.012):0;
game.muscle+=gain;game.strength+=completed>0?Math.min(0.2,completed*0.016):0;
game.workouts++;time(Math.max(5,Math.ceil(completed*0.6)+3));save();
show(success?'✅ Set completed!':'💥 Failed repetition',`${ex.name}<br>${weight} kg · ${completed}/${reps} reps<br>${success?'All repetitions completed.':'The character could not complete the next rep.'}<br>Muscle +${gain.toFixed(2)} · Strength: ${game.strength.toFixed(2)}`,[
['Repeat this exercise',()=>exerciseMenu(exercises.indexOf(ex))],
['Choose another machine',normalMenu],
['← Return to city',()=>{game.scene='city';save();close()},true]
])}
function interiorMenu(){
const scene=game.scene, back=['← Return to city',()=>{game.scene='city';save();close()},true];
if(scene==='home')show('🏠 Your Home','A furnished starter home. You can rest and eat here.',[
['🛏 Sleep 8 hours',()=>{time(480);show('Good morning!','You slept for 8 hours.',[['Continue',()=>{close()}],back])}],
['🧊 Eat from fridge ('+game.food+' meals)',()=>{if(game.food>0){game.food--;time(20);save();show('Meal finished','You ate at home.',[['Continue',close],back])}else show('Empty fridge','Visit GYM MARKET to buy groceries.',[back])}],
['👕 Wardrobe',()=>show('Wardrobe','Choose a starter shirt color.',[['Green',()=>{game.shirt='#38d59d';save();close()}],['Blue',()=>{game.shirt='#48aaff';save();close()}],['Red',()=>{game.shirt='#ee6d70';save();close()}],back])],back]);
else if(scene==='gym')gymMenu();
else if(scene==='market')show('🛒 GYM MARKET','Groceries go directly to your home fridge.',[['Buy 3 meals · $30',()=>{if(game.cash<30)return show('Not enough cash','You need $30.',[back]);game.cash-=30;game.food+=3;time(10);save();close()}],back]);
else if(scene==='shop')show('👕 GYM SHOP','Clothing collections are coming in a later update.',[back]);
else if(scene==='bar')show('🍹 GYM BAR','NPC conversations and relationships are coming later.',[back]);
else show('🌳 GYM PARK','A green corner of the city.',[back]);
}
function phone(){if(!game)return;show('📱 GYM PHONE',`Name: ${game.name}<br>Wallet: $${game.cash}<br>Steps: ${game.steps}<br>Workouts: ${game.workouts}<br>Strength: ${(game.strength??10).toFixed(1)}<br>Muscle: ${(game.muscle??0).toFixed(1)}<br>Food at home: ${game.food}<br>Time: ${timeLabel()}`,[['Close',close]])}
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(innerHeight*d);ctx.setTransform(d,0,0,d,0,0);ctx.imageSmoothingEnabled=false}
addEventListener('resize',resize);resize();
function poly(pts,color,stroke){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}}
function iso(x,y){return [(x-y)*TW/2,(x+y)*TH/2]}
function tile(x,y,c){const [sx,sy]=iso(x,y);poly([[sx,sy],[sx+TW/2,sy+TH/2],[sx,sy+TH],[sx-TW/2,sy+TH/2]],c,'#00000012')}
function box3(x,y,w,h,z,c){let a=iso(x,y),b=iso(x+w,y),d=iso(x,y+h),e=iso(x+w,y+h),top=[a,b,e,d].map(p=>[p[0],p[1]-z]);poly([d,e,[e[0],e[1]-z],[d[0],d[1]-z]],'#647d83');poly([b,e,[e[0],e[1]-z],[b[0],b[1]-z]],'#52656b');poly(top,c,'#ffffff50')}
function label(s,x,y){ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#0a1d28';ctx.strokeText(s,x,y);ctx.fillStyle='#fff';ctx.fillText(s,x,y)}
function avatar(x,y){ctx.fillStyle='#1d2937';ctx.fillRect(x-8,y-5,7,13);ctx.fillRect(x+2,y-5,7,13);ctx.fillStyle=game.shirt;ctx.fillRect(x-11,y-26,22,23);ctx.fillStyle='#d9a47e';ctx.fillRect(x-7,y-39,14,13);ctx.fillStyle='#28201c';ctx.fillRect(x-7,y-40,14,5);ctx.fillStyle='#fff';ctx.fillRect(x+3,y-33,3,2)}
function render(){
const w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#8cc8d5';ctx.fillRect(0,0,w,h);
if(!game)return;
const scale=clamp(Math.min(w/760,h/490)*0.95,0.53,1.4);
ctx.save();ctx.translate(w/2,h*0.54);ctx.scale(scale,scale);
if(game.scene==='city'){
let focus=iso(game.x,game.y);ctx.translate(-focus[0],-focus[1]);
for(let s=0;s<W+H;s++)for(let x=0;x<W;x++){let y=s-x;if(y<0||y>=H)continue;const road=(x===8||x===9||x===12||x===13||y===8||y===9||y===12||y===13);tile(x,y,road?'#5d6c76':(x+y)%2?'#75b67d':'#7dbc83');if(road&&(x+y)%4===0){let p=iso(x+.5,y+.5);ctx.fillStyle='#cdd4b5';ctx.fillRect(p[0]-2,p[1]+7,4,3)}}
const objects=[...buildings.map(b=>({sort:b.x+b.y+b.w+b.h,building:b})),{sort:game.x+game.y+0.4,player:true}].sort((a,b)=>a.sort-b.sort);
for(const o of objects){if(o.player){let p=iso(game.x+.5,game.y+.5);avatar(p[0],p[1]-5)}else{let b=o.building,z=b.type==='park'?12:78;box3(b.x,b.y,b.w,b.h,z,b.color);let p=iso(b.x+b.w/2,b.y+b.h/2);label(b.name,p[0],p[1]-z-12);}}
}else{
for(let y=0;y<10;y++)for(let x=0;x<12;x++)tile(x,y,(x+y)%2?'#c7bda4':'#b4ab96');
const stuff=game.scene==='home'?[[2,2,3,2,28,'#658db5'],[7,2,2,3,44,'#d6b89c'],[4,6,3,2,22,'#a58a74']]:game.scene==='gym'?[[2,2,2,2,38,'#626b7a'],[7,2,2,2,40,'#626b7a'],[4,6,4,1,18,'#535b68']]:[[3,3,2,2,35,'#8e9c9d'],[7,5,2,2,35,'#8e9c9d']];
stuff.forEach(a=>box3(...a));let p=iso(6,5);avatar(p[0],p[1]-10);
}
ctx.restore();
requestAnimationFrame(render)}
function move(dx,dy){if(!game||!overlay.classList.contains('hidden'))return;if(game.scene!=='city')return;const nx=clamp(game.x+dx,0.5,W-1.5),ny=clamp(game.y+dy,0.5,H-1.5);let blocked=buildings.some(b=>nx>b.x-.1&&nx<b.x+b.w+.1&&ny>b.y-.1&&ny<b.y+b.h+.1);if(!blocked){game.x=nx;game.y=ny;game.steps++;if(game.steps%8===0)time(1);save();updateHUD()}}
let hold=null;document.querySelectorAll('[data-move]').forEach(b=>{let dir=b.dataset.move,vec={up:[0,-.32],down:[0,.32],left:[-.32,0],right:[.32,0]}[dir];const stop=()=>{if(hold){clearInterval(hold);hold=null}};b.addEventListener('pointerdown',e=>{e.preventDefault();stop();move(...vec);hold=setInterval(()=>move(...vec),75)});['pointerup','pointercancel','pointerleave'].forEach(k=>b.addEventListener(k,stop))});
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)){e.preventDefault();keys.add(e.key.toLowerCase())}});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
setInterval(()=>{if(keys.has('arrowup')||keys.has('w'))move(0,-.28);if(keys.has('arrowdown')||keys.has('s'))move(0,.28);if(keys.has('arrowleft')||keys.has('a'))move(-.28,0);if(keys.has('arrowright')||keys.has('d'))move(.28,0)},75);
document.querySelector('#enter').onclick=act;document.querySelector('#phone').onclick=phone;document.querySelector('#back').onclick=menu;document.querySelector('#clock').onclick=phone;
game=load();menu();render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
